

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Protecto</title>
  <style>
    :root {
      --ok: #2e7d32;   /* grün */
      --warn: #f9a825; /* gelb */
      --bad: #c62828;  /* rot */
      --muted: #6b7280;
    }
    html, body { margin: 0; padding: 0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    .wrap { padding: 14px 16px 12px; width: 340px; }

    /* Score Header */
    .scoreBox { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .scoreCircle { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; }
    .scoreMeta { line-height: 1.1; }
    .scoreTitle { font-weight: 700; }
    .scoreSub { color: var(--muted); font-size: 12px; }

    /* Gründe */
    .card { background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
    .card h4 { margin: 0 0 8px; font-size: 14px; }
    ul.clean { list-style: none; padding: 0; margin: 0; }
    ul.clean li { margin: 6px 0; font-size: 13px; }

    /* Redirects */
    .redirects { margin-top: 10px; font-size: 13px; }

    /* Toggle */
    .toggleRow { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
    .toggleLabel { font-weight: 600; }
    .switch { position: relative; width: 52px; height: 28px; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #cbd5e1; border-radius: 999px; transition: background .25s ease; }
    .slider:before { content: ""; position: absolute; height: 22px; width: 22px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .25s ease; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .switch input:checked + .slider { background: #22c55e; }
    .switch input:checked + .slider:before { transform: translateX(24px); }

    /* Niemals mit Schutz */
    .npRow { margin-top: 16px; }
    .npInput { display: flex; gap: 8px; }
    .npInput input { flex: 1; padding: 8px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; }
    .npInput button { padding: 8px 10px; border-radius: 8px; border: 1px solid #e5e7eb; background:#fff; cursor:pointer; }
    .npList { margin-top: 8px; }
    .npList li { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; border:1px solid #e5e7eb; border-radius:8px; margin-top:6px; font-size:13px; }
    .npRemove { border:none; background:transparent; color:#dc2626; cursor:pointer; font-size:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- SCORE -->
    <div class="scoreBox">
      <div id="scoreCircle" class="scoreCircle" aria-label="Risiko-Score">—</div>
      <div class="scoreMeta">
        <div class="scoreTitle">Risiko für diese Seite</div>
        <div id="scoreText" class="scoreSub">Bewertung 1–100 (100 = sehr schlecht)</div>
      </div>
    </div>

    <!-- GRÜNDE -->
    <div class="card">
      <h4>Gründe für die Bewertung</h4>
      <ul id="reasons" class="clean">
        <li class="empty">Keine Daten verfügbar.</li>
      </ul>
    </div>

    <!-- REDIRECTS -->
    <div id="redirects" class="redirects">Tracker umgeleitet: —</div>

    <!-- TOGGLE -->
    <div class="toggleRow">
      <span class="toggleLabel">Schutz aktivieren</span>
      <label class="switch" title="Protecto an/aus">
        <input id="protectionToggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- NIEMALS MIT SCHUTZ -->
    <div class="npRow">
      <div style="font-weight:600; margin-bottom:6px;">Niemals mit Schutz</div>
      <div class="npInput">
        <input id="neverInput" type="text" placeholder="z. B. facebook.com" />
        <button id="addNeverBtn">Hinzufügen</button>
      </div>
      <ul id="neverProtectList" class="npList"></ul>
    </div>
  </div>

  <!-- Logik im externen Script -->
  <script src="popup.js"></script>
</body>
</html>
