<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Protecto</title>
  <style>
    :root {
      --ok: #22c55e;     /* grün */
      --warn: #f59e0b;   /* gelb */
      --bad: #ef4444;    /* rot */
      --muted: #6b7280;
      --bg: #0b1220;
      --panel: #0f172a;
      --panel-2: #0b1220;
      --border: #1f2a44;
      --text: #e5e7eb;
    }
    html, body { margin: 0; padding: 0; font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background: var(--bg); color: var(--text); }
    .wrap { padding: 14px 16px 16px; width: 360px; }

    /* Header */
    .hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .brand { font-weight:800; letter-spacing:.2px; }
    .small { color: var(--muted); font-size: 12px; }

    /* Score */
    .scoreBox { display:flex; align-items:center; gap: 12px; margin: 10px 0 8px; }
    .scoreCircle { width: 64px; height: 64px; border-radius: 50%; display:grid; place-items:center; color:#fff; font-weight:800; font-size:22px; background: #263042; border:1px solid var(--border); }
    .scoreMeta { line-height: 1.15; }
    .scoreTitle { font-weight: 700; }
    .scoreSub { color: var(--muted); font-size: 12px; }

    /* Cards */
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
    .card h4 { margin: 0 0 8px; font-size: 14px; }
    ul.clean { list-style: none; padding: 0; margin: 0; }
    ul.clean li { margin: 6px 0; font-size: 13px; }

    /* Redirects */
    .redirects { margin-top: 10px; font-size: 13px; color: var(--muted); }

    /* Toggle */
    .toggleRow { display:flex; align-items:center; justify-content:space-between; margin-top: 14px; padding: 10px 12px; background: var(--panel); border:1px solid var(--border); border-radius:12px; }
    .toggleLabel { font-weight: 700; }
    .switch { position: relative; width: 56px; height: 30px; }
    .switch input { display: none; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #324157; border-radius: 999px; transition: background .25s ease; border:1px solid var(--border); }
    .slider:before { content: ""; position: absolute; height: 24px; width: 24px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .25s ease; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
    .switch input:checked + .slider { background: #115e3b; }
    .switch input:checked + .slider:before { transform: translateX(26px); }

    /* Niemals mit Schutz */
    .npRow { margin-top: 12px; }
    .npHead { font-weight:700; margin-bottom:6px; }
    .npInput { display:flex; gap: 8px; }
    .npInput input { flex:1; padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; background: var(--panel-2); color: var(--text); }
    .npInput button { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background:#0e1a2e; color: #e5e7eb; cursor:pointer; }
    .npInput button:hover { background:#13223d; }
    .npList { margin-top: 8px; }
    .npList li { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border:1px solid var(--border); border-radius:10px; margin-top:6px; font-size:13px; background: var(--panel); }
    .npRemove { border:none; background:transparent; color:#ef4444; cursor:pointer; font-size:14px; }

    /* Pills */
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:#0f1a2f; font-size:11px; color:#a3aed0; margin-right:6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <div>
        <div class="brand">Protecto</div>
        <div class="small">Stealth‑Schutz mit On‑Device‑KI</div>
      </div>
      <div id="version" class="small">v0.2.0</div>
    </div>

    <!-- SCORE -->
    <div class="scoreBox">
      <div id="scoreCircle" class="scoreCircle" aria-label="Risiko-Score">—</div>
      <div class="scoreMeta">
        <div class="scoreTitle">Risiko für diese Seite</div>
        <div id="scoreText" class="scoreSub">Live‑Heuristik 1–100 (100 = hoch)</div>
        <div id="labels" class="small" style="margin-top:4px;"></div>
      </div>
    </div>

    <!-- GRÜNDE -->
    <div class="card">
      <h4>Gründe (heuristisch)</h4>
      <ul id="reasons" class="clean">
        <li class="empty">Noch keine Daten – Seite neu laden.</li>
      </ul>
    </div>

    <!-- REDIRECTS (heute / gesamt) -->
    <div id="redirects" class="redirects">Stealth‑Umleitungen: <span id="redirToday">—</span> heute · <span id="redirTotal">—</span> gesamt</div>

    <!-- TOGGLE -->
    <div class="toggleRow">
      <span class="toggleLabel">Schutz aktivieren</span>
      <label class="switch" title="Protecto an/aus">
        <input id="protectionToggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- NIEMALS MIT SCHUTZ -->
    <div class="npRow">
      <div class="npHead">Niemals mit Schutz</div>
      <div class="npInput">
        <input id="neverInput" type="text" placeholder="z. B. facebook.com" />
        <button id="addNeverBtn">Hinzufügen</button>
      </div>
      <ul id="neverProtectList" class="npList"></ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
